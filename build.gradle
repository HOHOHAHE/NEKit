buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'com.github.nekit'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
    
    sourceSets {
        main {
            java.srcDirs 'src_kt'
        }
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // Use slf4j-api for compile; the consumer application should provide the actual implementation (like logback-android)
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.13.5'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.5'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.13.5'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.13.5'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'net.java.dev.jna:jna:5.13.0'
    implementation 'com.maxmind.geoip2:geoip2:4.0.1'
    
    // Netty for networking
    implementation 'io.netty:netty-all:4.1.100.Final'
    
    // Ktor for networking (alternative to Netty for Android compatibility)
    implementation 'io.ktor:ktor-network:2.3.7'
    implementation 'io.ktor:ktor-network-tls:2.3.7'
    
    // Android specific dependencies
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// 增加一個獨立的執行 task，這完全不會影響原有 assembleRelease 或 Android 整合
afterEvaluate {
    tasks.register("runLocal", JavaExec) {
        group = 'application'
        description = 'Run Main.kt locally on Mac'
        
        // 確保執行前先編譯 debug 版本的 Kotlin 程式碼
        dependsOn 'compileDebugKotlin'
        
        // 指定 Main function 的進入點 (套件名稱 + 類別名稱)
        mainClass.set('com.example.nekit.main.MainKt')
        
        // 將 classpath 取值延後，避免設定階段找不到變數
        classpath = files("$buildDir/tmp/kotlin-classes/debug")
        
        // 移除 slf4j-android，避免在 Mac 上呼叫到不存在的 android.util.Log 原生方法
        classpath += files({ 
            configurations.getByName("debugRuntimeClasspath").filter { file ->
                !file.name.contains("slf4j-android")
            }
        })
        
        // 動態加入 slf4j-simple 供本機開發測試輸出 Log 使用
        classpath += configurations.detachedConfiguration(dependencies.create('org.slf4j:slf4j-simple:1.7.36'))
        
        classpath += files({ android.bootClasspath })
    }
}
