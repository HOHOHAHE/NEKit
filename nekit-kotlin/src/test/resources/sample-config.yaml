servers:
  - port: 18080
    type: HTTP # Enums are case-sensitive for Jackson by default
    host: "0.0.0.0"
  - port: 11080
    type: SOCKS5
    host: "127.0.0.1"

adapter-factories:
  - name: direct 
    type: direct
  - name: my-http-proxy
    type: http-proxy
    host: proxy.example.com
    port: 8080
  - name: my-socks5-proxy
    type: socks5-proxy
    host: socks.example.com
    port: 1080

rules:
  - type: domain 
    adapter: my-http-proxy 
    domains: 
      - "example.com"
      - "*.example.net"
    matcher: SUFFIX # Enums are case-sensitive
  - type: domain
    adapter: my-socks5-proxy
    domains: 
      - "google.com"
    matcher: KEYWORD
  - type: all 
    adapter: direct
